<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bọc Link - Anh Kiềm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        }

        .card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 24px;
            padding: 48px 36px;
            width: 90%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: cardShow 0.8s ease-out;
        }

        @keyframes cardShow {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            box-shadow: 0 0 24px rgba(99, 102, 241, 0.4);
        }

        h1 {
            font-size: 28px;
            color: #fff;
            line-height: 1.3;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .sub-text {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 36px;
        }

        .btn-continue {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-continue:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        .copyright {
            margin-top: 24px;
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-circle">→</div>
        <h1>BẠN ĐANG VÀO CÂY 🐔<br>CỦA HIỂN LX + KIỂM CM </h1>
        <p class="sub-text">Nhấn tiếp tục để truy cập nội dung.</p>
        <button class="btn-continue" onclick="goToLink()">TIẾP TỤC</button>
        <p class="copyright">© 2026</p>
    </div>

    <script>
        function goToLink() {
            window.location.href = "https://xoga88.com";
        }
    </script>
</body>
</html>
